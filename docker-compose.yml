services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: classpilot
      POSTGRES_USER: classpilot
      POSTGRES_PASSWORD: classpilot-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classpilot -d classpilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://classpilot:classpilot-local-only@database:5432/classpilot
      SESSION_SECRET: local-development-secret-that-must-be-replaced
      TOKEN_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DEMO_MODE: "false"
    ports: ["3000:3000"]
    depends_on:
      database:
        condition: service_healthy
  worker:
    build: .
    command: ["npm", "run", "start:worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://classpilot:classpilot-local-only@database:5432/classpilot
      SESSION_SECRET: local-development-secret-that-must-be-replaced
      TOKEN_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DEMO_MODE: "false"
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres-data:
